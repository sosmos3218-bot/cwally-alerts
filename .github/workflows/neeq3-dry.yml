name: neeq3-dry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: neeq3 dry run (no ntfy, no state commit)
        run: python scripts/neeq3_monitor.py dry
