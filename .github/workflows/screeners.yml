# 수동 실행만. 스케줄 없음. ntfy 없음. 결과를 main 에 커밋하지 않는다.
# 시총, PER, PBR 로 거른 뒤 DART 는 최대 300종목, 종목당 연결 한 번이 기본이다.
# 같은 분기 캐시를 재사용한다. 키는 출력하지 않는다. 제한 시간은 20분.

name: screeners

on:
  workflow_dispatch:
    inputs:
      screener:
        description: "트루엔, 기요하라, 또는 둘 다"
        required: true
        default: both
        type: choice
        options:
          - both
          - truen
          - kiyohara
      max_names:
        description: "DART 로 볼 최대 종목 수. 비우면 300"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: cwally-screeners
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Quarter key
        id: quarter
        run: |
          python - << 'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          quarter = (now.month - 1) // 3 + 1
          path = os.environ["GITHUB_OUTPUT"]
          with open(path, "a", encoding="utf-8") as handle:
              handle.write(f"id={now.year}Q{quarter}\n")
          PY

      - name: Restore quarterly financial cache
        uses: actions/cache@v4
        with:
          path: screeners/cache
          key: screener-dart-${{ steps.quarter.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            screener-dart-${{ steps.quarter.outputs.id }}-

      - name: Install pinned requirements
        run: python -m pip install -r trend_monitor/requirements.txt

      - name: Offline selftest
        run: python -m screeners selftest

      - name: Run screeners
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENDART_API_KEY:-}" ]; then
            echo "OPENDART_API_KEY 가 없습니다. 값은 출력하지 않습니다."
            exit 1
          fi
          choice="${{ inputs.screener }}"
          case "$choice" in
            truen) kinds="truen" ;;
            kiyohara) kinds="kiyohara" ;;
            both) kinds="truen kiyohara" ;;
            *)
              echo "알 수 없는 screener 입력"
              exit 1
              ;;
          esac
          mkdir -p screeners/output screeners/cache
          names="${{ inputs.max_names }}"
          if [ -n "$names" ] && ! printf '%s' "$names" | grep -Eq '^[0-9]+$'; then
            echo "max_names 는 숫자여야 합니다."
            exit 1
          fi
          limit_args=()
          if [ -n "$names" ]; then
            limit_args+=(--limit "$names")
          fi
          for kind in $kinds; do
            python -m screeners "$kind" --all --out screeners/output "${limit_args[@]}"
          done

      - name: Write step summary
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          mkdir -p screeners/output
          choice="${{ inputs.screener }}"
          case "$choice" in
            truen) kinds="truen" ;;
            kiyohara) kinds="kiyohara" ;;
            *) kinds="truen kiyohara" ;;
          esac
          python - "$kinds" << 'PY'
          import os
          import sys
          from pathlib import Path
          from screeners.render import brief_from_dir

          kinds = sys.argv[1].split()
          text = brief_from_dir(Path("screeners/output"), kinds)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(text)
          sys.stdout.write(text)
          PY

      - name: Upload screener results
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: screeners/output/
          if-no-files-found: warn
          retention-days: 14
