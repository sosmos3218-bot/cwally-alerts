name: cwally-flow-alerts

on:
  schedule:
    - cron: "40 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 finance-datareader
      - name: Run flow
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
        run: |
          python scripts/flow_monitor.py
          python scripts/secu_flow_monitor.py
          python scripts/kosbrk_monitor.py
      - name: Persist state
        run: |
          git config user.name "cwally-alerts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/flow_seen.json state/secu_flow.json state/kosbrk.json
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore: update flow state"
          git pull --rebase origin main || true
          git push origin HEAD:main
