name: cwally-flow-alerts

on:
  schedule:
    - cron: "40 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 finance-datareader
      - name: Run flow
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
        run: |
          failed=0
          run_one() {
            local label="$1"
            shift
            echo "::group::$label"
            if "$@"; then
              echo "$label ok"
            else
              echo "::error::$label failed (exit $?)"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_one flow_monitor python scripts/flow_monitor.py
          run_one secu_flow python scripts/secu_flow_monitor.py
          run_one kosbrk python scripts/kosbrk_monitor.py
          run_one k278240 python scripts/k278240_monitor.py
          run_one 377990 python scripts/377990_monitor.py
          run_one ethhl python scripts/ethhl_monitor.py
          if [ "$failed" -ne 0 ]; then
            echo "one or more flow scripts failed"
            exit 1
          fi
      - name: Persist state
        if: always()
        run: |
          git config user.name "cwally-alerts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/flow_seen.json state/secu_flow.json state/kosbrk.json state/k278240.json state/377990.json state/ethhl.json
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore: update flow state"
          git pull --rebase origin main
          git push origin HEAD:main
