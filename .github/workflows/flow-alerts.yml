name: cwally-flow-alerts

concurrency:
  group: cwally-flow-main
  cancel-in-progress: false

# On-time 15:40 is cron-job.org (after retune_1540: the 0090b0 port-alerts job).
# Manual / slot-watch fallback remains workflow_dispatch. No GitHub schedule backup.
on:
  workflow_dispatch:
    inputs:
      gsai_only:
        description: "Only evaluate the 20:30 GSAI actual-value payload; leave daytime flow untouched"
        type: boolean
        default: false
      gsai_payload:
        description: "KRX actual foreign net-buy KRW snapshot JSON from the authenticated browser relay"
        type: string
        required: false
        default: ""
      gsai_mode:
        description: "dry sends nothing and writes no state; auto evaluates the approved rule"
        type: choice
        options: [dry, auto]
        default: dry
      force:
        description: "run even if the flow slot already ran today"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/flow-requirements.txt
      - run: pip install -r .github/workflows/flow-requirements.txt
      - name: Slot guard
        id: guard
        run: |
          RUN=1
          if [ "${{ inputs.gsai_only }}" = "true" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.inputs.force }}" != "true" ]; then
            # once per KST day: a late GitHub cron or a duplicate dispatch skips (docs/ontime-dispatch.md)
            git fetch -q origin main && git show origin/main:state/slots/flow.json > /tmp/slot.json 2>/dev/null || echo '{}' > /tmp/slot.json
            SLOT_FILE=/tmp/slot.json python scripts/slot_guard.py check flow || RUN=0
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - name: Dup-guard since (flow 15:40)
        if: steps.guard.outputs.run == '1'
        run: python scripts/dup_guard_since.py --job flow >> "$GITHUB_ENV"
      - name: Run flow
        if: steps.guard.outputs.run == '1'
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
        run: |
          failed=0
          python scripts/slot_guard.py mark flow
          run_one() {
            local label="$1"
            shift
            echo "::group::$label"
            if "$@"; then
              echo "$label ok"
            else
              echo "::error::$label failed (exit $?)"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_one flow_monitor python scripts/flow_monitor.py
          run_one secu_flow python scripts/secu_flow_monitor.py
          # [KOSPI] ladder (2026-10-26): the 4 components below spool their signal sends (KOSPI_LADDER=1, scripts/kospi_spool.py),
          # then kospi send publishes ONE [KOSPI] message (component states restored if that publish fails)
          run_one kospi_begin python scripts/kospi_monitor.py begin
          export KOSPI_LADDER=1
          run_one kosbrk python scripts/kosbrk_monitor.py
          run_one kosdown python scripts/kosdown_monitor.py
          run_one kosup python scripts/kosup_monitor.py
          run_one kos5500 python scripts/kos5500_monitor.py afterclose
          unset KOSPI_LADDER
          run_one kospi python scripts/kospi_monitor.py send
          # [FR-DE] France-Germany 10Y spread stages + ETF recs (approved in chat 2026-10-30, ends 2027-02-26)
          run_one frde python scripts/frde_monitor.py auto
          run_one k200 python scripts/k200_monitor.py
          # samup and hynixup moved to the 005930/000660 engine extra_lines on 2026-10-26 (19:00 k203780 slot)
          run_one k278240 python scripts/k278240_monitor.py
          run_one 377990 python scripts/377990_monitor.py
          run_one ethhl python scripts/ethhl_monitor.py
          run_one kica python scripts/kica_monitor.py
          run_one dssotp python scripts/dssotp_monitor.py
          run_one gsai python scripts/gsai_monitor.py
          if [ "$failed" -ne 0 ]; then
            echo "one or more flow scripts failed"
            exit 1
          fi
      - name: Run GSAI actual-value relay
        if: github.event_name == 'workflow_dispatch' && inputs.gsai_only
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
          GSAI_PAYLOAD: ${{ inputs.gsai_payload }}
          GSAI_MODE: ${{ inputs.gsai_mode }}
        run: python scripts/gsai_monitor.py
      - name: Persist state
        id: persist
        if: always() && (steps.guard.outputs.run == '1' || (inputs.gsai_only && inputs.gsai_mode == 'auto'))
        # retry pull --rebase + push 5 times (5/15/30/60 s), state conflicts keep this run's state (pt13u)
        run: |
          bash scripts/persist_state.sh "chore: update flow state" state/slots/flow.json state/flow_seen.json state/secu_flow.json state/kosbrk.json state/kosdown.json state/kosup.json state/k200.json state/k278240.json state/377990.json state/ethhl.json state/kica.json state/dssotp.json state/kos5500.json state/kospi.json state/gsai.json state/frde.json
      - name: Upload state artifact (persist failed)
        if: failure() && steps.persist.outputs.persist_failed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/
          retention-days: 7
      - name: Notify ops on failure
        if: failure()
        env:
          NTFY_SERVER: https://ntfy.sh
          STATE_ARTIFACT: ${{ steps.persist.outputs.persist_failed == '1' && format('state-{0}-{1}', github.run_id, github.run_attempt) || '' }}
        run: python scripts/ops_notify.py flow-alerts flow
