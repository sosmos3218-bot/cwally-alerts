name: cwally-flow-alerts

concurrency:
  group: cwally-flow-main
  cancel-in-progress: false

on:
  schedule:
    - cron: "40 6 * * 1-5"
  workflow_dispatch:
    inputs:
      gsai_only:
        description: "Only evaluate the 20:30 GSAI actual-value payload; leave daytime flow untouched"
        type: boolean
        default: false
      gsai_payload:
        description: "KRX actual foreign net-buy KRW snapshot JSON from the authenticated browser relay"
        type: string
        required: false
        default: ""
      gsai_mode:
        description: "dry sends nothing and writes no state; auto evaluates the approved rule"
        type: choice
        options: [dry, auto]
        default: dry
      force:
        description: "run even if the flow slot already ran today"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 finance-datareader
      - name: Slot guard
        id: guard
        run: |
          RUN=1
          if [ "${{ inputs.gsai_only }}" = "true" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.inputs.force }}" != "true" ]; then
            # once per KST day: a late GitHub cron or a duplicate dispatch skips (docs/ontime-dispatch.md)
            git fetch -q origin main && git show origin/main:state/slots/flow.json > /tmp/slot.json 2>/dev/null || echo '{}' > /tmp/slot.json
            SLOT_FILE=/tmp/slot.json python scripts/slot_guard.py check flow || RUN=0
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - name: Run flow
        if: steps.guard.outputs.run == '1'
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
        run: |
          failed=0
          python scripts/slot_guard.py mark flow
          run_one() {
            local label="$1"
            shift
            echo "::group::$label"
            if "$@"; then
              echo "$label ok"
            else
              echo "::error::$label failed (exit $?)"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_one flow_monitor python scripts/flow_monitor.py
          run_one secu_flow python scripts/secu_flow_monitor.py
          run_one kosbrk python scripts/kosbrk_monitor.py
          run_one kosdown python scripts/kosdown_monitor.py
          run_one kosup python scripts/kosup_monitor.py
          run_one k200 python scripts/k200_monitor.py
          # samup and hynixup moved to the 005930/000660 engine extra_lines on 2026-10-26 (19:00 k203780 slot)
          run_one k278240 python scripts/k278240_monitor.py
          run_one 377990 python scripts/377990_monitor.py
          run_one ethhl python scripts/ethhl_monitor.py
          run_one kica python scripts/kica_monitor.py
          run_one dssotp python scripts/dssotp_monitor.py
          run_one kos5500 python scripts/kos5500_monitor.py afterclose
          run_one gsai python scripts/gsai_monitor.py
          if [ "$failed" -ne 0 ]; then
            echo "one or more flow scripts failed"
            exit 1
          fi
      - name: Run GSAI actual-value relay
        if: github.event_name == 'workflow_dispatch' && inputs.gsai_only
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
          GSAI_PAYLOAD: ${{ inputs.gsai_payload }}
          GSAI_MODE: ${{ inputs.gsai_mode }}
        run: python scripts/gsai_monitor.py
      - name: Persist state
        if: always() && (steps.guard.outputs.run == '1' || (inputs.gsai_only && inputs.gsai_mode == 'auto'))
        run: |
          git config user.name "cwally-alerts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/slots/flow.json state/flow_seen.json state/secu_flow.json state/kosbrk.json state/kosdown.json state/kosup.json state/k200.json state/k278240.json state/377990.json state/ethhl.json state/kica.json state/dssotp.json state/kos5500.json state/gsai.json
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore: update flow state"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Notify ops on failure
        if: failure()
        env:
          NTFY_SERVER: https://ntfy.sh
        run: python scripts/ops_notify.py flow-alerts flow
