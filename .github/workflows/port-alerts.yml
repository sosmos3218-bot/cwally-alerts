name: cwally-port-alerts

concurrency:
  group: cwally-port-main
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "0 12 * * 0"
    - cron: "0 19 15 9 *"
    - cron: "45 18 16 9 *"
    - cron: "15 7 18 9 *"
    - cron: "15 7 28 10 *"
    - cron: "15 7 30 10 *"
    - cron: "15 7 18 12 *"
  workflow_dispatch:
    inputs:
      job:
        description: steel | alux | square | clarity | hce | silicon2 | cover0198 | lg | 0220wl | iren | ustsy | sgyn | yencarry | krwfx | port | portlight | ccrev | kship | shinwon | protec | 2ub | druck | pltr | addstop | sec | all
        required: true
        default: all
        type: choice
        options: [all, steel, alux | square, clarity, hce, silicon2, cover0198, lg, 0220wl, iren, ustsy, sgyn, yencarry, krwfx, port, portlight, ccrev, kship, shinwon, protec, 2ub, druck, pltr, addstop, sec]
