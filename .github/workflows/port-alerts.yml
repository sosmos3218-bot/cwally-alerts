      - name: Archive ntfy
        if: always()
        run: python scripts/ntfy_archive.py
      - name: Persist state
        if: always()
        run: |
          git config user.name "cwally-alerts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore: update alert state"
          if ! git pull --rebase origin main; then
            git checkout --ours state/archive.json && python scripts/ntfy_archive.py && git add state/archive.json
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin HEAD:main
      - name: Notify ops on failure
        if: failure()
        env:
          NTFY_SERVER: https://ntfy.sh
        run: python scripts/ops_notify.py port-alerts "${{ steps.pick.outputs.job }}"

