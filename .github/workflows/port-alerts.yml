        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.pick.outputs.job == 'fig' }}
        run: |
          python scripts/fig_monitor.py dry
          echo "--- Monday status preview (force + FIG_DRY=1: no ntfy, no state) ---"
