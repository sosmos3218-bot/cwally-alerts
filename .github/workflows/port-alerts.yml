name: cwally-port-alerts

concurrency:
  group: cwally-port-main
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "40 6 * * 1-5"
    - cron: "0 12 * * 0"
    - cron: "45 18 16 9 *"
    - cron: "15 7 18 9 *"
    - cron: "15 7 28 10 *"
    - cron: "15 7 30 10 *"
    - cron: "15 7 18 12 *"
    - cron: "0 12 27 10 *"
    - cron: "40 6 28 10 *"
    - cron: "40 6 29 10 *"
    - cron: "45 13 14 10 *"
    - cron: "10 0 15 10 *"
    - cron: "0 13 14 10 *"
    - cron: "0 13 29 10 *"
    - cron: "10 0 7 10 *"
    - cron: "30 6 7 10 *"
    - cron: "10 7 6 10 *"
    - cron: "30 9 6 10 *"
    - cron: "20 18 7 10 *"
    - cron: "10 0 8 10 *"
    - cron: "40 6 15 10 *"
    - cron: "10 8 15 10 *"
    - cron: "0 23 4 11 *"
    - cron: "0 9 5 11 *"
    - cron: "10 20 9 10 *"
    - cron: "10 20 26 10 *"
    - cron: "10 20 3 11 *"
    - cron: "10 20 17 11 *"
    - cron: "10 20 8 12 *"
    - cron: "20 23 10 11 *"
    - cron: "20 23 11 11 *"
    - cron: "20 23 12 11 *"
    - cron: "30 22 2 12 *"
    - cron: "30 22 3 12 *"
    - cron: "10 0 5 12 *"
    - cron: "40 20 20 10 *"
    - cron: "10 22 20 10 *"
    - cron: "0 23 20 10 *"
    - cron: "5 0 13 10 *"
    - cron: "5 0 20 10 *"
    - cron: "5 0 27 10 *"
    - cron: "5 0 3 11 *"
    - cron: "5 0 10 11 *"
    - cron: "5 0 17 11 *"
    - cron: "5 0 24 11 *"
    - cron: "12 23 24 11 *"
    - cron: "12 0 25 11 *"
    - cron: "5 0 1 12 *"
    - cron: "12 23 1 12 *"
    - cron: "12 23 2 12 *"
    # ustsy10 oneshot_kst remaining (KST→UTC): 2026-10-07/08/09 02:15
    - cron: "15 17 6 10 *"
    - cron: "15 17 7 10 *"
    - cron: "15 17 8 10 *"
    # lgiq3 oneshot_kst (KST→UTC): 2026-10-28 16:10, 10-29 09:10, 10-30 09:10, 11-03 09:10
    - cron: "10 7 28 10 *"
    - cron: "10 0 29 10 *"
    - cron: "10 0 30 10 *"
    - cron: "10 0 3 11 *"
    # lgcnsq3 oneshot_kst (KST→UTC): 2026-10-27 09:10, 10-30 16:10, 11-12 09:10, 11-13 16:10, 11-16 09:10
    - cron: "10 0 27 10 *"
    - cron: "10 7 30 10 *"
    - cron: "10 0 12 11 *"
    - cron: "10 7 13 11 *"
    - cron: "10 0 16 11 *"
    # nvdaq3 oneshot_kst (KST→UTC): 2026-11-18/19/20/26/27 07:10
    - cron: "10 22 17 11 *"
    - cron: "10 22 18 11 *"
    - cron: "10 22 19 11 *"
    - cron: "10 22 25 11 *"
    - cron: "10 22 26 11 *"
    # fedodds oneshot_kst (KST→UTC): 2026-10-08 03:35, 10-08 09:25, 10-14 23:05, 10-15 09:25
    - cron: "35 18 7 10 *"
    - cron: "25 0 8 10 *"
    - cron: "5 14 14 10 *"
    - cron: "25 0 15 10 *"
    # lgesq3 oneshot_kst (KST→UTC): 10-07 09:12/16:12, 10-08 09:12/16:12, 10-09 09:12, 10-13/16/23/30 09:12
    - cron: "12 0 7 10 *"
    - cron: "12 7 7 10 *"
    - cron: "12 0 8 10 *"
    - cron: "12 7 8 10 *"
    - cron: "12 0 9 10 *"
    - cron: "12 0 13 10 *"
    - cron: "12 0 16 10 *"
    - cron: "12 0 23 10 *"
    - cron: "12 0 30 10 *"
  workflow_dispatch:
    inputs:
      job:
        description: oneshot (due one-shots from configs/*.json oneshot_kst) | steel | alux | square | hce | silicon2 | cover0198 | lg | 0220wl | iren | ustsy | sgyn | yencarry | krwfx | port | portlight | ccrev | kship | shinwon | protec | 2ub | pltr | addstop | sec | krbank | k091160 | skc011790 | zs1006 | sk1006 | oklo | pffd | all
        required: true
        default: all
        type: choice
        options: [all, morning, afternoon, 0090b0, oneshot, steel, alux, square, hce, silicon2, cover0198, lg, 0220wl, iren, ustsy, sgyn, yencarry, krwfx, port, portlight, ccrev, kship, shinwon, protec, 2ub, pltr, addstop, sec, krbank, k091160, skc011790, zs1006, sk1006, oklo, pffd]
      steel_mode:
        description: weekly | quarterly | event
        default: weekly
        type: choice
        options: [weekly, quarterly, event]
      alux_mode:
        description: weekly | event
        default: weekly
        type: choice
        options: [weekly, event]
      hce_mode:
        description: daily | event
        default: daily
        type: choice
        options: [daily, event]
      silicon2_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      cover0198_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      lg_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      wl_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      iren_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      yencarry_mode:
        description: auto | fed | weekly | event | boj_press
        default: auto
        type: choice
        options: [auto, fed, weekly, event, boj_press]
      krwfx_mode:
        description: auto | weekly | force
        default: auto
        type: choice
        options: [auto, weekly, force]
      force_square:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Decide jobs
        id: pick
        run: |
          JOB="${{ github.event.inputs.job }}"
          YC=auto
          KX=auto
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ]; then JOB=morning
            elif [ "${{ github.event.schedule }}" = "20 6 * * 1-5" ]; then JOB=afternoon
            elif [ "${{ github.event.schedule }}" = "0 12 * * 0" ]; then JOB=portlight
            elif [ "${{ github.event.schedule }}" = "45 18 16 9 *" ]; then JOB=yencarry; YC=fed
            elif [ "${{ github.event.schedule }}" = "15 7 28 10 *" ]; then JOB=sec
            elif [ "${{ github.event.schedule }}" = "0 12 27 10 *" ] || [ "${{ github.event.schedule }}" = "40 6 28 10 *" ] || [ "${{ github.event.schedule }}" = "40 6 29 10 *" ]; then JOB=hce
            elif [ "${{ github.event.schedule }}" = "15 7 18 9 *" ] || [ "${{ github.event.schedule }}" = "15 7 30 10 *" ] || [ "${{ github.event.schedule }}" = "15 7 18 12 *" ]; then JOB=yencarry; YC=boj_press
            elif [ "${{ github.event.schedule }}" = "45 13 14 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 15 10 *" ]; then JOB=cpi1014
            elif [ "${{ github.event.schedule }}" = "0 13 14 10 *" ] || [ "${{ github.event.schedule }}" = "0 13 29 10 *" ]; then JOB=dram27
            elif [ "${{ github.event.schedule }}" = "10 0 7 10 *" ] || [ "${{ github.event.schedule }}" = "30 6 7 10 *" ]; then JOB=zs1006
            elif [ "${{ github.event.schedule }}" = "10 7 6 10 *" ] || [ "${{ github.event.schedule }}" = "30 9 6 10 *" ]; then JOB=sk1006
            elif [ "${{ github.event.schedule }}" = "20 18 7 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 8 10 *" ]; then JOB=fomc1007
            elif [ "${{ github.event.schedule }}" = "35 18 7 10 *" ] || [ "${{ github.event.schedule }}" = "25 0 8 10 *" ] || [ "${{ github.event.schedule }}" = "5 14 14 10 *" ] || [ "${{ github.event.schedule }}" = "25 0 15 10 *" ]; then JOB=fedodds
            elif [ "${{ github.event.schedule }}" = "40 6 15 10 *" ] || [ "${{ github.event.schedule }}" = "10 8 15 10 *" ]; then JOB=tsmc1015
            elif [ "${{ github.event.schedule }}" = "0 23 4 11 *" ] || [ "${{ github.event.schedule }}" = "0 9 5 11 *" ]; then JOB=pcor
            elif [ "${{ github.event.schedule }}" = "10 20 9 10 *" ] || [ "${{ github.event.schedule }}" = "10 20 26 10 *" ] || [ "${{ github.event.schedule }}" = "10 20 3 11 *" ] || [ "${{ github.event.schedule }}" = "10 20 17 11 *" ] || [ "${{ github.event.schedule }}" = "10 20 8 12 *" ]; then JOB=spcxq3
            elif [ "${{ github.event.schedule }}" = "20 23 10 11 *" ] || [ "${{ github.event.schedule }}" = "20 23 11 11 *" ] || [ "${{ github.event.schedule }}" = "20 23 12 11 *" ]; then JOB=oklo
            elif [ "${{ github.event.schedule }}" = "30 22 2 12 *" ] || [ "${{ github.event.schedule }}" = "30 22 3 12 *" ] || [ "${{ github.event.schedule }}" = "10 0 5 12 *" ]; then JOB=pathq3
            elif [ "${{ github.event.schedule }}" = "40 20 20 10 *" ] || [ "${{ github.event.schedule }}" = "10 22 20 10 *" ] || [ "${{ github.event.schedule }}" = "0 23 20 10 *" ]; then JOB=isrgq3
            elif [ "${{ github.event.schedule }}" = "5 0 13 10 *" ] || [ "${{ github.event.schedule }}" = "5 0 20 10 *" ] || [ "${{ github.event.schedule }}" = "5 0 27 10 *" ] || [ "${{ github.event.schedule }}" = "5 0 3 11 *" ] || [ "${{ github.event.schedule }}" = "5 0 10 11 *" ] || [ "${{ github.event.schedule }}" = "5 0 17 11 *" ] || [ "${{ github.event.schedule }}" = "5 0 24 11 *" ] || [ "${{ github.event.schedule }}" = "12 23 24 11 *" ] || [ "${{ github.event.schedule }}" = "12 0 25 11 *" ] || [ "${{ github.event.schedule }}" = "5 0 1 12 *" ] || [ "${{ github.event.schedule }}" = "12 23 1 12 *" ] || [ "${{ github.event.schedule }}" = "12 23 2 12 *" ]; then JOB=aeo
            elif [ "${{ github.event.schedule }}" = "40 6 * * 1-5" ]; then JOB=0090b0
            elif [ "${{ github.event.schedule }}" = "15 17 6 10 *" ] || [ "${{ github.event.schedule }}" = "15 17 7 10 *" ] || [ "${{ github.event.schedule }}" = "15 17 8 10 *" ]; then JOB=ustsy10
            elif [ "${{ github.event.schedule }}" = "10 7 28 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 29 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 30 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 3 11 *" ]; then JOB=lgiq3
            elif [ "${{ github.event.schedule }}" = "10 0 27 10 *" ] || [ "${{ github.event.schedule }}" = "10 7 30 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 12 11 *" ] || [ "${{ github.event.schedule }}" = "10 7 13 11 *" ] || [ "${{ github.event.schedule }}" = "10 0 16 11 *" ]; then JOB=lgcnsq3
            elif [ "${{ github.event.schedule }}" = "10 22 17 11 *" ] || [ "${{ github.event.schedule }}" = "10 22 18 11 *" ] || [ "${{ github.event.schedule }}" = "10 22 19 11 *" ] || [ "${{ github.event.schedule }}" = "10 22 25 11 *" ] || [ "${{ github.event.schedule }}" = "10 22 26 11 *" ]; then JOB=nvdaq3
            elif [ "${{ github.event.schedule }}" = "12 0 7 10 *" ] || [ "${{ github.event.schedule }}" = "12 7 7 10 *" ] || [ "${{ github.event.schedule }}" = "12 0 8 10 *" ] || [ "${{ github.event.schedule }}" = "12 7 8 10 *" ] || [ "${{ github.event.schedule }}" = "12 0 9 10 *" ] || [ "${{ github.event.schedule }}" = "12 0 13 10 *" ] || [ "${{ github.event.schedule }}" = "12 0 16 10 *" ] || [ "${{ github.event.schedule }}" = "12 0 23 10 *" ] || [ "${{ github.event.schedule }}" = "12 0 30 10 *" ]; then JOB=lgesq3
            else
              echo "unmatched schedule: ${{ github.event.schedule }}"
              exit 1
            fi
          fi
          [ -z "$JOB" ] && JOB=all
          # One-shot dedupe (scripts/oneshot_pick.py, state/slots/oneshot.json, docs/ontime-dispatch.md).
          # Read the marks from origin/main: this run's checkout can predate the on-time run's push.
          sync_oneshot_marks() {
            git fetch -q origin main
            mkdir -p state/slots
            git show origin/main:state/slots/oneshot.json > state/slots/oneshot.json 2>/dev/null || echo '{"done": {}}' > state/slots/oneshot.json
          }
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$JOB" in
              morning|afternoon|portlight|0090b0) ;;
              *)
                # late GitHub one-shot cron = fallback; skip if the on-time dispatch already ran it
                sync_oneshot_marks
                rc=0; KEY=$(python scripts/oneshot_pick.py check-cron "$JOB" "${{ github.event.schedule }}") || rc=$?
                if [ "$rc" = "10" ]; then echo "one-shot $KEY already ran on time; skip"; JOB=skip
                elif [ "$rc" = "0" ]; then python scripts/oneshot_pick.py mark "$KEY"
                else echo "one-shot cron not listed in oneshot_kst ($KEY); run without mark"
                fi
                ;;
            esac
          fi
          if [ "$JOB" = "oneshot" ]; then
            sync_oneshot_marks
            rc=0; python scripts/oneshot_pick.py pick --out "$RUNNER_TEMP/oneshot_plan.json" || rc=$?
            if [ "$rc" = "10" ]; then JOB=skip; elif [ "$rc" != "0" ]; then exit "$rc"; fi
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "afternoon" ] || [ "$JOB" = "0090b0" ]; then
            # once per KST day per slot: a late GitHub cron or a duplicate dispatch skips (docs/ontime-dispatch.md).
            # To re-run a slot by hand on the same day, dispatch job=all or the single alert's job id.
            git fetch -q origin main && git show "origin/main:state/slots/$JOB.json" > /tmp/slot.json 2>/dev/null || echo '{}' > /tmp/slot.json
            if ! SLOT_FILE=/tmp/slot.json python scripts/slot_guard.py check "$JOB"; then JOB=skip; fi
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          DOW=$(date -u +%u); DAY=$(date -u +%d); MON=$(date -u +%m)
          if [ "$DAY" = "01" ] && echo "$MON" | grep -Eq '01|04|07|10'; then SM=quarterly
          elif [ "$DOW" = "1" ]; then SM=weekly
          else SM=event
          fi
          AM=$SM; [ "$AM" = "quarterly" ] && AM=weekly
          if [ "$DOW" = "1" ]; then HM=daily; else HM=event; fi
          if [ "$JOB" = "hce" ]; then HM=daily; fi
          S2=event
          C8=event
          LG=event
          WL=event
          IR=event
          if [ "$DOW" = "1" ]; then IR=weekly; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SM="${{ github.event.inputs.steel_mode }}"
            AM="${{ github.event.inputs.alux_mode }}"
            HM="${{ github.event.inputs.hce_mode }}"
            S2="${{ github.event.inputs.silicon2_mode }}"
            C8="${{ github.event.inputs.cover0198_mode }}"
            LG="${{ github.event.inputs.lg_mode }}"
            WL="${{ github.event.inputs.wl_mode }}"
            IR="${{ github.event.inputs.iren_mode }}"
            YC="${{ github.event.inputs.yencarry_mode }}"
            KX="${{ github.event.inputs.krwfx_mode }}"
            [ -z "$KX" ] && KX=auto
          fi
          echo "steel_mode=$SM" >> "$GITHUB_OUTPUT"
          echo "alux_mode=$AM" >> "$GITHUB_OUTPUT"
          echo "hce_mode=$HM" >> "$GITHUB_OUTPUT"
          echo "silicon2_mode=$S2" >> "$GITHUB_OUTPUT"
          echo "cover0198_mode=$C8" >> "$GITHUB_OUTPUT"
          echo "lg_mode=$LG" >> "$GITHUB_OUTPUT"
          echo "wl_mode=$WL" >> "$GITHUB_OUTPUT"
          echo "iren_mode=$IR" >> "$GITHUB_OUTPUT"
          echo "yencarry_mode=$YC" >> "$GITHUB_OUTPUT"
          echo "krwfx_mode=$KX" >> "$GITHUB_OUTPUT"
      - name: Run steel + alux + hce + lg + iren + yencarry + krwfx + port + portlight + ccrev + shinwon + protec + 2ub + pltr + addstop + sec + krbank
        if: steps.pick.outputs.job == 'morning' || steps.pick.outputs.job == 'all' || steps.pick.outputs.job == 'steel' || steps.pick.outputs.job == 'alux' || steps.pick.outputs.job == 'hce' || steps.pick.outputs.job == 'lg' || steps.pick.outputs.job == 'iren' || steps.pick.outputs.job == 'yencarry' || steps.pick.outputs.job == 'krwfx' || steps.pick.outputs.job == 'port' || steps.pick.outputs.job == 'portlight' || steps.pick.outputs.job == 'ccrev' || steps.pick.outputs.job == 'shinwon' || steps.pick.outputs.job == 'protec' || steps.pick.outputs.job == '2ub' || steps.pick.outputs.job == 'pltr' || steps.pick.outputs.job == 'addstop' || steps.pick.outputs.job == 'sec' || steps.pick.outputs.job == 'krbank'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
        run: |
          JOB="${{ steps.pick.outputs.job }}"
          # isolate failures: one broken script must not skip the rest (flow-alerts run_one pattern)
          set +e
          failed=0
          trap 'failed=1; echo "::error::script failed: $BASH_COMMAND"' ERR
          if [ "$JOB" = "morning" ] || [ "$JOB" = "afternoon" ]; then python scripts/slot_guard.py mark "$JOB"; fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "steel" ]; then
            python scripts/steel_monitor.py "${{ steps.pick.outputs.steel_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "alux" ]; then
            python scripts/alux_monitor.py "${{ steps.pick.outputs.alux_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "hce" ]; then
            python scripts/hce_monitor.py "${{ steps.pick.outputs.hce_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "lg" ]; then
            python scripts/lg_monitor.py "${{ steps.pick.outputs.lg_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "iren" ]; then
            python scripts/iren_monitor.py "${{ steps.pick.outputs.iren_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "yencarry" ]; then
            python scripts/yencarry_monitor.py "${{ steps.pick.outputs.yencarry_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "krwfx" ]; then
            MODE="${{ steps.pick.outputs.krwfx_mode }}"
            [ "$JOB" = "krwfx" ] && [ "$MODE" = "auto" ] && MODE=weekly
            python scripts/krwfx_monitor.py "$MODE"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "port" ]; then
            python scripts/port_monitor.py
            python scripts/brk10_monitor.py event
            python scripts/googl_monitor.py event
          fi
          if [ "$JOB" = "portlight" ]; then
            python scripts/portlight_monitor.py auto
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "ccrev" ]; then
            python scripts/ccrev_monitor.py
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "shinwon" ]; then
            MODE=event
            [ "$JOB" = "shinwon" ] && MODE=force
            python scripts/shinwon_monitor.py "$MODE"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "protec" ]; then
            MODE=event
            [ "$JOB" = "protec" ] && MODE=force
            python scripts/protec_monitor.py "$MODE"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "2ub" ]; then
            python scripts/2ub_monitor.py auto
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "pltr" ]; then
            python scripts/pltr_monitor.py auto
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "addstop" ]; then
            python scripts/addstop_monitor.py auto
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "sec" ]; then
            python scripts/sec_monitor.py auto
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "krbank" ]; then
            MODE=auto
            [ "$JOB" = "krbank" ] && MODE=force
            python scripts/krbank_monitor.py "$MODE"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ]; then
            python scripts/ratesbell_monitor.py auto
            python scripts/btcbox_monitor.py
            python scripts/xrpbox_monitor.py
            python scripts/btcoct_monitor.py
            python scripts/btc90_monitor.py
            python scripts/sndk_monitor.py auto
            python scripts/gval_monitor.py
            python scripts/burry_monitor.py auto
            python scripts/s455850_monitor.py
            python scripts/yen489_monitor.py
            python scripts/nov3_monitor.py
            python scripts/dhr_monitor.py auto
            python scripts/cl_monitor.py auto
            python scripts/semrev_monitor.py
            python scripts/dkq3_monitor.py auto
            python scripts/hsteelq3_monitor.py auto
            python scripts/dram27_monitor.py auto
            python scripts/genpact_monitor.py auto
            python scripts/nke_monitor.py auto
            python scripts/oklo_monitor.py auto
            python scripts/d0chk_monitor.py
          fi
          python scripts/ntfy_archive.py
          exit $failed
      - name: Run square + silicon2 + cover0198 + 0220wl + lg + ustsy + sgyn + yencarry + kship + shinwon + protec + pltr + addstop + k091160 + skc011790 (afternoon)
        if: steps.pick.outputs.job == 'afternoon' || steps.pick.outputs.job == 'square' || steps.pick.outputs.job == 'silicon2' || steps.pick.outputs.job == 'cover0198' || steps.pick.outputs.job == '0220wl' || steps.pick.outputs.job == 'ustsy' || steps.pick.outputs.job == 'sgyn' || steps.pick.outputs.job == 'kship' || steps.pick.outputs.job == 'protec' || steps.pick.outputs.job == 'pltr' || steps.pick.outputs.job == 'addstop' || steps.pick.outputs.job == 'k091160' || steps.pick.outputs.job == 'skc011790' || steps.pick.outputs.job == 'all'
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
          FORCE_ALERT: ${{ github.event.inputs.force_square != 'false' && github.event.inputs.force_square != 'false' && github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          JOB="${{ steps.pick.outputs.job }}"
          # isolate failures: one broken script must not skip the rest (flow-alerts run_one pattern)
          set +e
          failed=0
          trap 'failed=1; echo "::error::script failed: $BASH_COMMAND"' ERR
          if [ "$JOB" = "morning" ] || [ "$JOB" = "afternoon" ]; then python scripts/slot_guard.py mark "$JOB"; fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "square" ]; then
            node scripts/square_sell_alert.mjs
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "silicon2" ]; then
            python scripts/silicon2_monitor.py "${{ steps.pick.outputs.silicon2_mode }}"
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "cover0198" ]; then
            python scripts/cover0198_monitor.py "${{ steps.pick.outputs.cover0198_mode }}"
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "0220wl" ]; then
