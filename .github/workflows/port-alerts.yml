name: cwally-port-alerts

concurrency:
  group: cwally-port-main
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "0 19 15 9 *"
    - cron: "45 18 16 9 *"
    - cron: "15 7 18 9 *"
    - cron: "15 7 30 10 *"
    - cron: "15 7 18 12 *"
    - cron: "15 22 10 12 *"
  workflow_dispatch:
    inputs:
      job:
        description: steel | alux | square | clarity | hce | silicon2 | cover0198 | lg | 0220wl | iren | ustsy | sgyn | yencarry | port | ccrev | kship | shinwon | avgochain | all
        required: true
        default: all
        type: choice
        options: [all, steel, alux, square, clarity, hce, silicon2, cover0198, lg, 0220wl, iren, ustsy, sgyn, yencarry, port, ccrev, kship, shinwon, avgochain]
      steel_mode:
        description: weekly | quarterly | event
        default: weekly
        type: choice
        options: [weekly, quarterly, event]
      alux_mode:
        description: weekly | event
        default: weekly
        type: choice
        options: [weekly, event]
      hce_mode:
        description: daily | event
        default: daily
        type: choice
        options: [daily, event]
      silicon2_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      cover0198_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      lg_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      wl_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      iren_mode:
        description: event | weekly
        default: event
        type: choice
        options: [event, weekly]
      yencarry_mode:
        description: auto | fed | weekly | event | boj_press
        default: auto
        type: choice
        options: [auto, fed, weekly, event, boj_press]
      avgochain_mode:
        description: auto | print
        default: auto
        type: choice
        options: [auto, print]
      force_square:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Decide jobs
        id: pick
        run: |
          JOB="${{ github.event.inputs.job }}"
          YC=auto
          AV=auto
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "20 6 * * 1-5" ]; then JOB=afternoon
            elif [ "${{ github.event.schedule }}" = "0 19 15 9 *" ]; then JOB=clarity
            elif [ "${{ github.event.schedule }}" = "45 18 16 9 *" ]; then JOB=yencarry; YC=fed
            elif [ "${{ github.event.schedule }}" = "15 7 18 9 *" ] || [ "${{ github.event.schedule }}" = "15 7 30 10 *" ] || [ "${{ github.event.schedule }}" = "15 7 18 12 *" ]; then JOB=yencarry; YC=boj_press
            elif [ "${{ github.event.schedule }}" = "15 22 10 12 *" ]; then JOB=avgochain; AV=print
            else JOB=morning
            fi
          fi
          [ -z "$JOB" ] && JOB=all
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          DOW=$(date -u +%u); DAY=$(date -u +%d); MON=$(date -u +%m)
          if [ "$DAY" = "01" ] && echo "$MON" | grep -Eq '01|04|07|10'; then SM=quarterly
          elif [ "$DOW" = "1" ]; then SM=weekly
          else SM=event
          fi
          AM=$SM; [ "$AM" = "quarterly" ] && AM=weekly
          if [ "$DOW" = "1" ]; then HM=daily; else HM=event; fi
          S2=event
          C8=event
          LG=event
          WL=event
          IR=event
          if [ "$DOW" = "1" ]; then IR=weekly; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SM="${{ github.event.inputs.steel_mode }}"
            AM="${{ github.event.inputs.alux_mode }}"
            HM="${{ github.event.inputs.hce_mode }}"
            S2="${{ github.event.inputs.silicon2_mode }}"
            C8="${{ github.event.inputs.cover0198_mode }}"
            LG="${{ github.event.inputs.lg_mode }}"
            WL="${{ github.event.inputs.wl_mode }}"
            IR="${{ github.event.inputs.iren_mode }}"
            YC="${{ github.event.inputs.yencarry_mode }}"
            AV="${{ github.event.inputs.avgochain_mode }}"
            [ -z "$AV" ] && AV=auto
          fi
          echo "steel_mode=$SM" >> "$GITHUB_OUTPUT"
          echo "alux_mode=$AM" >> "$GITHUB_OUTPUT"
          echo "hce_mode=$HM" >> "$GITHUB_OUTPUT"
          echo "silicon2_mode=$S2" >> "$GITHUB_OUTPUT"
          echo "cover0198_mode=$C8" >> "$GITHUB_OUTPUT"
          echo "lg_mode=$LG" >> "$GITHUB_OUTPUT"
          echo "wl_mode=$WL" >> "$GITHUB_OUTPUT"
          echo "iren_mode=$IR" >> "$GITHUB_OUTPUT"
          echo "yencarry_mode=$YC" >> "$GITHUB_OUTPUT"
          echo "avgochain_mode=$AV" >> "$GITHUB_OUTPUT"
      - name: Run steel + alux + clarity + hce + lg + iren + yencarry + port + ccrev + shinwon
        if: steps.pick.outputs.job == 'morning' || steps.pick.outputs.job == 'all' || steps.pick.outputs.job == 'steel' || steps.pick.outputs.job == 'alux' || steps.pick.outputs.job == 'clarity' || steps.pick.outputs.job == 'hce' || steps.pick.outputs.job == 'lg' || steps.pick.outputs.job == 'iren' || steps.pick.outputs.job == 'yencarry' || steps.pick.outputs.job == 'port' || steps.pick.outputs.job == 'ccrev' || steps.pick.outputs.job == 'shinwon'
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
        run: |
          JOB="${{ steps.pick.outputs.job }}"
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "steel" ]; then
            python scripts/steel_monitor.py "${{ steps.pick.outputs.steel_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "alux" ]; then
            python scripts/alux_monitor.py "${{ steps.pick.outputs.alux_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "clarity" ]; then
            python scripts/clarity_monitor.py
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "hce" ]; then
            python scripts/hce_monitor.py "${{ steps.pick.outputs.hce_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "lg" ]; then
            python scripts/lg_monitor.py "${{ steps.pick.outputs.lg_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "iren" ]; then
            python scripts/iren_monitor.py "${{ steps.pick.outputs.iren_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "yencarry" ]; then
            python scripts/yencarry_monitor.py "${{ steps.pick.outputs.yencarry_mode }}"
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "port" ]; then
            python scripts/port_monitor.py
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "ccrev" ]; then
            python scripts/ccrev_monitor.py
          fi
          if [ "$JOB" = "morning" ] || [ "$JOB" = "all" ] || [ "$JOB" = "shinwon" ]; then
            MODE=event
            [ "$JOB" = "shinwon" ] && MODE=force
            python scripts/shinwon_monitor.py "$MODE"
          fi
      - name: Run square + silicon2 + cover0198 + 0220wl + lg + ustsy + sgyn + yencarry + kship + shinwon + avgochain (afternoon)
        if: steps.pick.outputs.job == 'afternoon' || steps.pick.outputs.job == 'square' || steps.pick.outputs.job == 'silicon2' || steps.pick.outputs.job == 'cover0198' || steps.pick.outputs.job == '0220wl' || steps.pick.outputs.job == 'ustsy' || steps.pick.outputs.job == 'sgyn' || steps.pick.outputs.job == 'kship' || steps.pick.outputs.job == 'avgochain' || steps.pick.outputs.job == 'all'
        env:
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
          FORCE_ALERT: ${{ github.event.inputs.force_square != 'false' && github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          JOB="${{ steps.pick.outputs.job }}"
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "square" ]; then
            node scripts/square_sell_alert.mjs
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "silicon2" ]; then
            python scripts/silicon2_monitor.py "${{ steps.pick.outputs.silicon2_mode }}"
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "cover0198" ]; then
            python scripts/cover0198_monitor.py "${{ steps.pick.outputs.cover0198_mode }}"
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "0220wl" ]; then
            python scripts/0220wl_monitor.py "${{ steps.pick.outputs.wl_mode }}"
          fi
          if [ "$JOB" = "afternoon" ]; then
            python scripts/lg_monitor.py "${{ steps.pick.outputs.lg_mode }}"
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "ustsy" ]; then
            python scripts/ustsy_monitor.py event
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "sgyn" ]; then
            pip install -q openpyxl
            python scripts/sgyn_monitor.py event
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ]; then
            python scripts/yencarry_monitor.py event
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "kship" ]; then
            if [ "$JOB" = "kship" ]; then
              python scripts/kship_monitor.py force
            else
              python scripts/kship_monitor.py auto
            fi
          fi
          if [ "$JOB" = "afternoon" ]; then
            python scripts/shinwon_monitor.py event
          fi
          if [ "$JOB" = "afternoon" ] || [ "$JOB" = "all" ] || [ "$JOB" = "avgochain" ]; then
            python scripts/avgochain_monitor.py "${{ steps.pick.outputs.avgochain_mode }}"
          fi
      - name: Persist state
        run: |
          git config user.name "cwally-alerts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state || true
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore: update alert state"
          git pull --rebase origin main || true
          git push origin HEAD:main
