permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Decide jobs
        id: pick
        run: |
          JOB="${{ github.event.inputs.job }}"
          YC=auto
          KX=auto
          KZ=auto
          KC=auto
          HQ=auto
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ]; then JOB=morning
            elif [ "${{ github.event.schedule }}" = "20 6 * * 1-5" ]; then JOB=afternoon
            elif [ "${{ github.event.schedule }}" = "0 12 * * 0" ]; then JOB=portlight
            elif [ "${{ github.event.schedule }}" = "45 18 16 9 *" ]; then JOB=yencarry; YC=fed
            elif [ "${{ github.event.schedule }}" = "15 7 28 10 *" ]; then JOB=sec
            elif [ "${{ github.event.schedule }}" = "0 12 27 10 *" ] || [ "${{ github.event.schedule }}" = "40 6 28 10 *" ] || [ "${{ github.event.schedule }}" = "40 6 29 10 *" ]; then JOB=hce
            elif [ "${{ github.event.schedule }}" = "15 7 18 9 *" ] || [ "${{ github.event.schedule }}" = "15 7 30 10 *" ] || [ "${{ github.event.schedule }}" = "15 7 18 12 *" ]; then JOB=yencarry; YC=boj_press
            elif [ "${{ github.event.schedule }}" = "0 13 14 10 *" ] || [ "${{ github.event.schedule }}" = "0 13 29 10 *" ]; then JOB=dram27
            elif [ "${{ github.event.schedule }}" = "0 23 4 11 *" ] || [ "${{ github.event.schedule }}" = "0 9 5 11 *" ]; then JOB=pcorq3
            elif [ "${{ github.event.schedule }}" = "10 20 9 10 *" ] || [ "${{ github.event.schedule }}" = "10 20 26 10 *" ] || [ "${{ github.event.schedule }}" = "10 20 3 11 *" ] || [ "${{ github.event.schedule }}" = "10 20 17 11 *" ] || [ "${{ github.event.schedule }}" = "10 20 8 12 *" ]; then JOB=spcxq3
            elif [ "${{ github.event.schedule }}" = "20 23 10 11 *" ] || [ "${{ github.event.schedule }}" = "20 23 11 11 *" ] || [ "${{ github.event.schedule }}" = "20 23 12 11 *" ]; then JOB=oklo
            elif [ "${{ github.event.schedule }}" = "30 22 2 12 *" ] || [ "${{ github.event.schedule }}" = "30 22 3 12 *" ] || [ "${{ github.event.schedule }}" = "10 0 5 12 *" ]; then JOB=pathq3
            elif [ "${{ github.event.schedule }}" = "5 0 13 10 *" ] || [ "${{ github.event.schedule }}" = "5 0 20 10 *" ] || [ "${{ github.event.schedule }}" = "5 0 27 10 *" ] || [ "${{ github.event.schedule }}" = "5 0 3 11 *" ] || [ "${{ github.event.schedule }}" = "5 0 10 11 *" ] || [ "${{ github.event.schedule }}" = "5 0 17 11 *" ] || [ "${{ github.event.schedule }}" = "5 0 24 11 *" ] || [ "${{ github.event.schedule }}" = "12 23 24 11 *" ] || [ "${{ github.event.schedule }}" = "12 0 25 11 *" ] || [ "${{ github.event.schedule }}" = "5 0 1 12 *" ] || [ "${{ github.event.schedule }}" = "12 23 1 12 *" ] || [ "${{ github.event.schedule }}" = "12 23 2 12 *" ]; then JOB=aeo
            elif [ "${{ github.event.schedule }}" = "40 6 * * 1-5" ]; then JOB=0090b0
            elif [ "${{ github.event.schedule }}" = "10 7 28 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 29 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 30 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 3 11 *" ]; then JOB=lgiq3
            elif [ "${{ github.event.schedule }}" = "18 0 8 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 27 10 *" ] || [ "${{ github.event.schedule }}" = "10 7 30 10 *" ] || [ "${{ github.event.schedule }}" = "10 0 12 11 *" ] || [ "${{ github.event.schedule }}" = "10 7 13 11 *" ] || [ "${{ github.event.schedule }}" = "10 0 16 11 *" ]; then JOB=lgcnsq3
