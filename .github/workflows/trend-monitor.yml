# 평일 15:40 KST. 승인 2026-11-02.
# 정시 실행은 0090b0 port-alerts 러너에 합쳐졌다 (retune_1540). 수동/slot-watch 는 workflow_dispatch.
# 같은 KST 날에 이미 돌았거나 그날 output 이 main 에 있으면 조용히 끝난다.
# 휴장이면 스크립트가 종료코드 0 으로 끝나고 알림을 보내지 않습니다.

name: trend-monitor

on:
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 YYYY-MM-DD 또는 YYYYMMDD. 비우면 서울 기준 최근 마감 거래일"
        required: false
        default: ""
        type: string
      demo:
        description: "데모 픽스처만 사용"
        required: false
        default: false
        type: boolean
      allow_partial:
        description: "15:30 이전 미완성 봉 허용"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "ntfy 본문만 출력하고 보내지 않음"
        required: false
        default: false
        type: boolean
      force:
        description: "같은 KST 날에 이미 돌았어도 다시 실행"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cwally-trend-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trend_monitor/requirements.txt

      - name: Install pinned requirements
        run: python -m pip install -r trend_monitor/requirements.txt

      - name: Slot guard
        id: guard
        run: |
          set -euo pipefail
          # demo, dry_run, and a hand-picked date do not consume today's slot.
          if [ "${{ inputs.demo }}" = "true" ] || [ "${{ inputs.dry_run }}" = "true" ] || [ -n "${{ inputs.date }}" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "mark=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "mark=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN=1
          git fetch -q origin main
          git show origin/main:state/slots/trend.json > /tmp/slot.json 2>/dev/null || echo '{}' > /tmp/slot.json
          if ! SLOT_FILE=/tmp/slot.json python scripts/slot_guard.py check trend; then
            RUN=0
          fi
          day=$(TZ=Asia/Seoul date +%F)
          if git cat-file -e "origin/main:trend_monitor/output/${day}.json" 2>/dev/null; then
            echo "output ${day}.json already on main; skip"
            RUN=0
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mark=$RUN" >> "$GITHUB_OUTPUT"
      - name: Dup-guard since (trend 15:40)
        if: steps.guard.outputs.run == '1'
        run: python scripts/dup_guard_since.py --job trend >> "$GITHUB_ENV"
      - name: Run trend monitor
        if: steps.guard.outputs.run == '1'
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          NTFY_TOPIC: cwally-port
          NTFY_SERVER: https://ntfy.sh
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DEMO: ${{ inputs.demo }}
          INPUT_PARTIAL: ${{ inputs.allow_partial }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${{ steps.guard.outputs.mark }}" = "1" ]; then
            python scripts/slot_guard.py mark trend
          fi
          args=()
          if [ "${INPUT_DEMO}" = "true" ]; then
            args+=(--demo)
          fi
          if [ -n "${INPUT_DATE}" ]; then
            args+=(--date "${INPUT_DATE}")
          fi
          if [ "${INPUT_PARTIAL}" = "true" ]; then
            args+=(--allow-partial)
          fi
          if [ "${INPUT_DRY}" = "true" ]; then
            args+=(--dry-run)
          fi
          # 보유와 관심 종목은 체크아웃된 trend_monitor/holdings.csv, watchlist.csv 를 읽습니다.
          python -m trend_monitor "${args[@]}"

      - name: Commit output to main
        if: ${{ always() && !cancelled() && steps.guard.outputs.run == '1' && (github.event_name == 'schedule' || (inputs.demo != true && inputs.dry_run != true)) }}
        run: |
          set -euo pipefail
          git config user.name "cwally-alerts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- trend_monitor/holdings.csv trend_monitor/watchlist.csv
          git add -- trend_monitor/output/latest.json trend_monitor/output/*.json trend_monitor/output/*.md trend_monitor/output/*.csv
          if [ -f state/slots/trend.json ]; then
            git add -- state/slots/trend.json
          fi
          if git diff --cached --name-only -- trend_monitor/holdings.csv trend_monitor/watchlist.csv | grep -q .; then
            echo "refusing to commit holdings.csv or watchlist.csv"
            exit 1
          fi
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore: update trend monitor output [skip ci]"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main; then
              ok=1
              break
            fi
            sleep $((i * 5))
          done
          if [ "$ok" != "1" ]; then
            echo "rebase failed"
            exit 1
          fi
          git push origin HEAD:main

      - name: Notify ops on failure
        if: failure()
        env:
          NTFY_SERVER: https://ntfy.sh
        run: python3 scripts/ops_notify.py trend-monitor trend
