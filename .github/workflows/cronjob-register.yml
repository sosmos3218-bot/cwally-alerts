name: cwally-cronjob-register

# Registers ONE one-shot time on cron-job.org (port-alerts.yml dispatch, {"job":"oneshot"}).
# action=delete (approved in chat 2026-10-19) removes listed one-shot jobs of this repo only.
# action=register_slot (approved in chat 2026-10-22 18:07 KST) creates the one fixed recurring
# "cwally port after-close (18:00 KST)" job (k203780 slot); nothing else.
# New workflow file approved in chat 2026-10-06. workflow_dispatch only: no schedule, no ntfy alert
# except the ops notice on failure. See scripts/cronjob_register.py for the checks.

concurrency:
  group: cwally-cronjob-register
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      action:
        description: "register (default) = create one oneshot job | register_slot = create the fixed 18:00 KST after-close job | delete = remove the job_ids below"
        type: choice
        options: [register, register_slot, delete]
        default: register
      job_ids:
        description: "action=delete only: comma-separated cron-job.org job ids (one-shot triggers of this repo only)"
        required: false
        type: string
        default: ""
      title:
        description: "action=register: cron-job.org job title, e.g. cwally oneshot 03:35 KST (Oct 8) fedodds"
        required: false
        type: string
      kst:
        description: "action=register: YYYY-MM-DD HH:MM KST (must be an oneshot_kst entry)"
        required: false
        type: string
      expires_kst:
        description: "action=register: YYYY-MM-DD HH:MM:SS KST (same year, not before kst)"
        required: false
        type: string
      dry_run:
        description: "run every check but do not create/delete any job"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Register (or delete) oneshot jobs
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_ACTION: ${{ inputs.action || 'register' }}
          CRONJOB_JOB_IDS: ${{ inputs.job_ids }}
          CRONJOB_TITLE: ${{ inputs.title }}
          CRONJOB_KST: ${{ inputs.kst }}
          CRONJOB_EXPIRES_KST: ${{ inputs.expires_kst }}
          CRONJOB_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set +e
          python scripts/cronjob_register.py
          rc=$?
          if [ "$rc" = "10" ]; then
            echo "already registered, skip"
            exit 0
          fi
          exit "$rc"
      - name: Notify ops on failure
        if: failure()
        env:
          NTFY_SERVER: https://ntfy.sh
          REGISTER_KST: ${{ inputs.kst }}
        run: python scripts/ops_notify.py cronjob-register "$REGISTER_KST"
