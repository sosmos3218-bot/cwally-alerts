name: cwally-cronjob-register

# Registers ONE one-shot time on cron-job.org (port-alerts.yml dispatch, {"job":"oneshot"}).
# action=delete (approved in chat 2026-10-19) removes listed one-shot jobs of this repo only.
# action=register_slot (approved in chat 2026-10-22 18:07 KST) creates the one fixed recurring
# after-close job (k203780 slot); nothing else.
# action=update_slot (approved in chat 2026-10-22 18:29 KST) moves only that job (id 8698629) to
# "cwally port after-close (19:00 KST)", weekdays 19:00 Asia/Seoul; URL, body and auth unchanged.
# action=list (2026-10-23) is read-only: one GET /jobs, prints schedule and last/next execution, no headers.
# action=list_bodies is read-only: GET /jobs, then GET /jobs/{id} for each port-alerts.yml
# dispatch. 3s between calls, stops on HTTP 429 with no retry, writes a checkpoint artifact.
# It does not create, update, or delete a job, and it does not notify.
# action=register_pulse (mktpulse recurring job approved in chat 2026-10-22 09:43, configs/mktpulse.json
# cron_approved) creates only "cwally mktpulse 10/11/13/15 KST weekdays"; skips if it already exists.
# action=update_pulse (approved in chat 2026-10-26) moves only job 8705009 to "cwally mktpulse 11 KST weekdays"
# (weekdays 11:00 Asia/Seoul, expires 2026-11-05 11:59:59); URL, body and auth unchanged.
# action=register_tslaspcx (approved in chat 2026-10-24 12:28 KST, configs/tslaspcx.json) creates only
# "cwally tslaspcx daily (07:30 KST)" (every day 07:30 Asia/Seoul, body job=tslaspcx oneoff_mode=auto); skips if it exists.
# action=register_tsla (approved 2026-10-29, configs/tsla.json) creates or retunes
# "cwally tsla US regular 1h (NY)" (America/New_York, minute 0, hours 10-16, Mon-Fri,
# body job=tsla oneoff_mode=auto). An existing half-hour job or 30min title is patched. The monitor gates 09:30-16:00.
# action=retune_1540 moves job 8588895 (0090b0) to 15:40 and disables 8588899 and 8782372 (no delete).
# action=register_trend (2026-11-03, docs/ontime-dispatch.md) creates only
# "cwally trend-monitor (15:40 KST)": weekdays 15:40 Asia/Seoul, URL trend-monitor.yml,
# body {"ref":"main","inputs":{}}. Skips if that title or that URL at 15:40 already exists.
# Does not modify the port-alerts or flow-alerts 15:40 jobs.
# New workflow file approved in chat 2026-10-06. workflow_dispatch only: no schedule, no ntfy alert
# except the ops notice on failure. See scripts/cronjob_register.py for the checks.

concurrency:
  group: cwally-cronjob-register
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      action:
        description: "register (default) = create one oneshot job | register_slot = create the fixed 19:00 KST after-close job | update_slot = move job 8698629 to 19:00 KST | delete = remove the job_ids below | list = read-only job list | list_bodies = read-only GET of each port-alerts.yml dispatch body | register_pulse = create the mktpulse 11 KST weekday job | update_pulse = move job 8705009 to 11 KST only | register_tslaspcx = create the daily 07:30 KST tslaspcx job | register_portlight = create the Sunday 21:00 KST portlight job | register_tsla = create or retune the TSLA US-regular hourly NY job (also renames 30min→1h title) | register_trend = create the weekday 15:40 KST trend-monitor job | retune_1540 = move 0090b0 job 8588895 to 15:40 and disable flow/trend cron-job.org jobs (no delete)"
        type: choice
        options: [register, register_slot, update_slot, fix_slot_oneoff, delete, list, list_bodies, register_pulse, update_pulse, register_tslaspcx, register_portlight, register_tsla, register_trend, retune_1540]
        default: register
      job_ids:
        description: "action=delete only: comma-separated cron-job.org job ids (one-shot triggers of this repo only)"
        required: false
        type: string
        default: ""
      title:
        description: "action=register: cron-job.org job title, e.g. cwally oneshot 03:35 KST (Oct 8) fedodds"
        required: false
        type: string
      kst:
        description: "action=register: YYYY-MM-DD HH:MM KST (must be an oneshot_kst entry)"
        required: false
        type: string
      expires_kst:
        description: "action=register: YYYY-MM-DD HH:MM:SS KST (same year, not before kst)"
        required: false
        type: string
      dry_run:
        description: "run every check but do not create/delete any job"
        type: boolean
        default: false
      resume_after:
        description: "action=list_bodies only: skip job ids at or below this id when the checkpoint has no row for them. Empty starts at the beginning, or continues a restored checkpoint."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  register:
    if: inputs.action != 'list_bodies'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Register (or delete) oneshot jobs
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_ACTION: ${{ inputs.action || 'register' }}
          CRONJOB_JOB_IDS: ${{ inputs.job_ids }}
          CRONJOB_TITLE: ${{ inputs.title }}
          CRONJOB_KST: ${{ inputs.kst }}
          CRONJOB_EXPIRES_KST: ${{ inputs.expires_kst }}
          CRONJOB_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set +e
          python scripts/cronjob_register.py
          rc=$?
          if [ "$rc" = "10" ]; then
            echo "already registered, skip"
            exit 0
          fi
          exit "$rc"
      - name: Notify ops on failure
        if: failure()
        env:
          NTFY_SERVER: https://ntfy.sh
          REGISTER_KST: ${{ inputs.kst }}
        run: python scripts/ops_notify.py cronjob-register "$REGISTER_KST"

  list_bodies:
    if: inputs.action == 'list_bodies'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore list_bodies checkpoint
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p list-bodies-prev
          rid="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cronjob-list-bodies&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.id != ${{ github.run_id }})][0].workflow_run.id // empty')"
          if [ -z "${rid}" ] || [ "${rid}" = "null" ]; then
            echo "no previous list_bodies checkpoint"
            exit 0
          fi
          gh run download "${rid}" -n cronjob-list-bodies -D list-bodies-prev
          found="$(find list-bodies-prev -name checkpoint.json -type f -print -quit)"
          if [ -z "${found}" ]; then
            echo "previous artifact had no checkpoint.json"
            exit 0
          fi
          if [ "${found}" != "list-bodies-prev/checkpoint.json" ]; then
            cp "${found}" list-bodies-prev/checkpoint.json
          fi
          echo "restored checkpoint from run ${rid}"
      - name: Read dispatch bodies
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_ACTION: list_bodies
          CRONJOB_RESUME_AFTER: ${{ inputs.resume_after }}
          CRONJOB_CHECKPOINT: list-bodies-prev/checkpoint.json
          CRONJOB_LIST_BODIES_DIR: list-bodies
        run: python scripts/cronjob_register.py
      - name: Upload list_bodies checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cronjob-list-bodies
          path: |
            list-bodies/checkpoint.json
            list-bodies/bodies.csv
          if-no-files-found: warn
          retention-days: 14
