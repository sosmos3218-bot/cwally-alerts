name: cwally-cronjob-register

on:
  workflow_dispatch:
    inputs:
      title:
        description: cron-job.org job title
        required: true
        type: string
      kst:
        description: YYYY-MM-DD HH:MM KST
        required: true
        type: string
      expires_kst:
        description: YYYY-MM-DD HH:MM:SS KST
        required: true
        type: string

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Register one oneshot
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_TITLE: ${{ inputs.title }}
          CRONJOB_KST: ${{ inputs.kst }}
          CRONJOB_EXPIRES_KST: ${{ inputs.expires_kst }}
        run: python scripts/cronjob_register.py
