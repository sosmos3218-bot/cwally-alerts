name: workflow-lint

# One job for workflow syntax and the title-ticker rule. A second workflow on the
# same push bills another minute. Bot state and screen output commits use [skip ci].
# '!trend_monitor/output/**' drops trend output even if a commit also forgets [skip ci].
# Do not combine paths and paths-ignore on the same event; GitHub rejects the workflow (no job starts).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "trend_monitor/**"
      - "!trend_monitor/output/**"
      - "outbox/**"
      - "configs/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "trend_monitor/**"
      - "!trend_monitor/output/**"
      - "outbox/**"
      - "configs/**"

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard against truncated or placeholder workflows
        run: |
          set -u
          fail=0
          for f in .github/workflows/*.yml; do
            if grep -Eiq 'truncated for brevit[y]|rest of (the )?(file|workflow)|unchanged\)|full content from /tm[p]' "$f"; then
              echo "::error file=$f::placeholder or truncation text found"
              fail=1
            fi
            if ! grep -Eq '^jobs:' "$f"; then
              echo "::error file=$f::top-level jobs: is missing"
              fail=1
            fi
            if ! grep -Eq '^on:' "$f"; then
              echo "::error file=$f::top-level on: is missing"
              fail=1
            fi
          done
          exit $fail

      - name: Guard against large shrink of a workflow file
        run: |
          set -u
          if git log -1 --format=%B | grep -q '\[allow-shrink\]'; then
            echo "allow-shrink requested in commit message"
            exit 0
          fi
          fail=0
          for f in $(git diff --name-only HEAD~1 HEAD -- .github/workflows 2>/dev/null); do
            [ -f "$f" ] || continue
            old=$(git show "HEAD~1:$f" 2>/dev/null | wc -l)
            new=$(wc -l < "$f")
            if [ "$old" -ge 50 ] && [ $((new * 100)) -lt $((old * 80)) ]; then
              echo "::error file=$f::line count dropped from $old to $new (>20%). Restore the file and apply a minimal diff, or add [allow-shrink] to the commit message."
              fail=1
            fi
          done
          exit $fail

      - name: actionlint (syntax and expressions)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          # actionlint 1.7.7 still enforces the old 10-input limit for workflow_dispatch; GitHub now allows more, so that one message is ignored.
          ./actionlint -color -shellcheck= -pyflakes= -ignore 'maximum number of inputs'

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run title_ticker_check.py
        id: chk
        run: |
          set +e
          python scripts/title_ticker_check.py > ttc.out 2>&1
          rc=$?
          set -e
          cat ttc.out
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "day=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "checker exit code: $rc"

      - name: Daily dedupe lookup
        id: dd
        if: steps.chk.outputs.rc != '0' && github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: .ttc-ops-sent
          key: title-ticker-ops-${{ steps.chk.outputs.day }}
          lookup-only: true

      - name: Notify cwally-ops (once per KST day)
        id: notify
        if: steps.chk.outputs.rc != '0' && github.event_name == 'push'
        env:
          DRY: "0"
          ALREADY: ${{ steps.dd.outputs.cache-hit == 'true' && '1' || '0' }}
          DAY: ${{ steps.chk.outputs.day }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NTFY_SERVER: https://ntfy.sh
        run: python scripts/title_ticker_ops_notify.py ttc.out

      - name: Mark sent for today
        if: steps.notify.outputs.sent == '1'
        run: echo "${{ steps.chk.outputs.day }}" > .ttc-ops-sent

      - name: Save daily dedupe
        if: steps.notify.outputs.sent == '1'
        uses: actions/cache/save@v4
        with:
          path: .ttc-ops-sent
          key: title-ticker-ops-${{ steps.chk.outputs.day }}

      - name: Fail on title ticker violations
        if: steps.chk.outputs.rc != '0'
        run: |
          echo "::error::title_ticker_check exit ${{ steps.chk.outputs.rc }} (STATIC or legacy FAIL lines above)"
          exit 1

      - name: Notify ops on failure
        if: failure() && (steps.chk.outputs.rc == '0' || steps.chk.outputs.rc == '')
        env:
          NTFY_SERVER: https://ntfy.sh
        run: python3 scripts/ops_notify.py workflow-lint "${GITHUB_SHA::7}" lint
